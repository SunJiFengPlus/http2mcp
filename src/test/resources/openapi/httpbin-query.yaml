openapi: 3.1.0
info:
  title: HttpBin Query
  version: 1.0.0
servers:
  - url: https://httpbin.org
paths:
  /get:
    get:
      operationId: queryEcho
      summary: Echo query params
      parameters:
        - name: foo
          in: query
          required: true
          schema:
            type: string
        - name: bar
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: ok
